name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# One run per branch. A new push supersedes an in-flight run rather than queueing
# behind it, which matters most for the macOS job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        working-directory: backend
        run: ./mvnw -B verify

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

  infra:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # No credentials and no backend: this checks the configuration is well formed,
      # not what it would do to a live account.
      - name: Validate
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform fmt -check -recursive
          terraform validate

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The runner's default Xcode, on purpose. Selecting /Applications/Xcode_16.app
      # looked safer and was the whole problem: on the macos-15 image only the default
      # Xcode has an iOS simulator runtime installed, and the alternate versions ship
      # with none -- "Unable to find a device" with an empty list of simulators, in
      # under a minute, before building anything. The deployment target pins the
      # minimum iOS; any simulator at or above it will do.
      #
      # The device is chosen from what is actually installed rather than named, for
      # the same reason: image updates rename the current iPhone, and a pinned name
      # is a failure waiting for the next runner refresh.
      - name: Pick a simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted(k for k in runtimes if "iOS" in k)
          for key in reversed(ios):
              phones = [d["name"] for d in runtimes[key] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]); break
          ')
          echo "Using: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # The shared scheme disables parallel testing on purpose; see CLAUDE.md.
      - name: Test
        run: |
          xcodebuild test \
            -project OmniMusik/OmniMusik.xcodeproj \
            -scheme OmniMusik \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -quiet
