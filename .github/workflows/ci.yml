name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# One run per branch. A new push supersedes an in-flight run rather than queueing
# behind it, which matters most for the macOS job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        working-directory: backend
        run: ./mvnw -B verify

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

  infra:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # No credentials and no backend: this checks the configuration is well formed,
      # not what it would do to a live account.
      - name: Validate
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform fmt -check -recursive
          terraform validate

  ios:
    name: iOS
    # macos-14, not the newest image: its default Xcode ships iOS 18 simulators,
    # which is the OS the app targets and the one the suite is verified against on
    # a device. macos-15's default Xcode carries only iOS 26 runtimes, and the UI
    # suite hung there for an hour, twice, on a simulator no local run had seen.
    # Whether the app should also pass on iOS 26 is a real question -- but it is a
    # compatibility task to schedule, not a reason for CI to test a different OS
    # from the one the project pins.
    runs-on: macos-14
    # A macOS minute costs ten Linux minutes, and a UI test waiting on a simulator
    # that never answers would otherwise run to GitHub's six-hour default. A clean
    # run is under forty minutes; anything past this is a hang, not a slow build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Choose an Xcode by what it can actually do, not by its path or by which one
      # the image makes default. Three runs failed three different ways on
      # assumptions here: /Applications/Xcode_16.app on macos-15 had no simulator
      # runtime at all; the default on macos-15 is Xcode 26, whose only runtime is
      # iOS 26, where the UI suite hangs; the default on macos-14 is Xcode 15,
      # which cannot read a project saved with Xcode 16 synchronized folders.
      #
      # The project needs Xcode 16 or newer and an iOS 18 simulator, because iOS
      # 18 is the deployment target and the OS the suite is verified on. So: walk
      # every Xcode on the runner, ask which iOS runtimes exist (simulator runtimes
      # are installed per machine, not per Xcode -- every row lists the same set,
      # which is expected), take the first Xcode >= 16 with an iOS 18 runtime, and
      # print the whole table either way -- a failure that lists what was available
      # is a failure somebody can act on.
      - name: Select an Xcode with an iOS 18 simulator
        id: sim
        run: |
          python3 - <<'PY' | tee /tmp/xcode-choice.txt
          import json, os, re, subprocess, sys
          chosen = None
          for app in sorted(p for p in os.listdir('/Applications') if re.match(r'Xcode.*\.app$', p)):
              path = f'/Applications/{app}'
              dev = f'{path}/Contents/Developer'
              try:
                  ver = subprocess.run([f'{dev}/usr/bin/xcodebuild', '-version'], capture_output=True, text=True,
                                       env={**os.environ, 'DEVELOPER_DIR': dev}).stdout.split()[1]
                  raw = subprocess.run(['xcrun', 'simctl', 'list', 'devices', 'available', '-j'], capture_output=True, text=True,
                                       env={**os.environ, 'DEVELOPER_DIR': dev}).stdout
                  devices = json.loads(raw)['devices']
              except Exception as e:
                  print(f'{app:28} unreadable ({e})'); continue
              runtimes = {k.split('.')[-1]: [d['name'] for d in v if d['name'].startswith('iPhone')]
                          for k, v in devices.items() if 'iOS' in k and v}
              print(f'{app:28} Xcode {ver:8} iOS runtimes: {", ".join(sorted(runtimes)) or "none"}')
              major = int(ver.split('.')[0])
              ios18 = [(k, v) for k, v in runtimes.items() if k.startswith('iOS-18') and v]
              if chosen is None and major >= 16 and ios18:
                  chosen = (path, ios18[0][1][0])
          if not chosen:
              print('No Xcode on this runner has both Xcode >= 16 and an iOS 18 simulator.', file=sys.stderr); sys.exit(1)
          print(f'CHOSEN {chosen[0]} {chosen[1]}')
          PY
          read -r _ XCODE DEVICE <<<"$(grep '^CHOSEN' /tmp/xcode-choice.txt)"
          sudo xcode-select -s "$XCODE"
          echo "name=$DEVICE" >> "$GITHUB_OUTPUT"

      # One xcodebuild invocation hung for an hour, twice, with nothing in its
      # log: not a single test had started. Package resolution, the simulator
      # boot, or the build itself -- a single step cannot say which. So the run
      # is four steps, each doing one thing, each with a timeout sized for that
      # thing, and the first one that stalls is the diagnosis. Splitting it showed
      # the first three take under four minutes together.
      #
      # Signing is left at its default. A simulator build ad-hoc signs with no
      # certificate and no keychain, which is what makes it launchable; turning
      # signing off outright produced an unsigned bundle the simulator would not
      # start, and xcodebuild then waited on a test host that never came up.
      - name: Resolve packages
        timeout-minutes: 10
        run: xcodebuild -resolvePackageDependencies -project OmniMusik/OmniMusik.xcodeproj -scheme OmniMusik

      - name: Boot the simulator
        timeout-minutes: 5
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.name }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.name }}" -b
          xcrun simctl list devices booted

      - name: Build for testing
        timeout-minutes: 25
        run: |
          xcodebuild build-for-testing \
            -project OmniMusik/OmniMusik.xcodeproj \
            -scheme OmniMusik \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath DerivedData \
            2>&1 | grep -vE "^\s*$|warning: |note: |^\s+\^|^[0-9]+$" ; exit ${PIPESTATUS[0]}

      # The shared scheme disables parallel testing on purpose; see CLAUDE.md.
      - name: Test
        timeout-minutes: 12
        run: |
          xcodebuild test-without-building \
            -project OmniMusik/OmniMusik.xcodeproj \
            -scheme OmniMusik \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee test-output.log | grep -E "Test Case|Test Suite|error:|Executed|\*\* TEST|Testing (started|failed)" ; exit ${PIPESTATUS[0]}

      # Runs even when Test hangs. Locally the suite passes in every configuration
      # tried -- two-step, single-step, fresh build output, a freshly erased
      # simulator -- and on the runner not one test starts, which means the answer
      # is only visible from inside the runner: what xcodebuild last printed, what
      # the app process is doing, and what the simulator's own log says about the
      # app and XCTest. Printed straight into the job log, so no artifact needs
      # downloading to read it.
      - name: Diagnose
        if: always()
        timeout-minutes: 4
        run: |
          echo "::group::last 60 lines xcodebuild wrote"
          tail -60 test-output.log 2>/dev/null || echo "(no test-output.log)"
          echo "::endgroup::"
          echo "::group::processes"
          pgrep -fl "OmniMusik|xctest|XCTest|simctl|CoreSimulator" || echo "(none)"
          echo "::endgroup::"
          echo "::group::stack sample of the app, if it is running"
          sample OmniMusik 3 -file /tmp/sample.txt >/dev/null 2>&1 && grep -m1 -A 40 "Call graph" /tmp/sample.txt || echo "(no OmniMusik process to sample)"
          echo "::endgroup::"
          echo "::group::simulator log, last 10 minutes, app + XCTest"
          xcrun simctl spawn booted log show --last 10m \
            --predicate 'process == "OmniMusik" OR process == "xctest" OR subsystem CONTAINS "xctest" OR subsystem CONTAINS "XCTest" OR eventMessage CONTAINS "OmniMusik"' 2>/dev/null \
            | grep -vE "^Timestamp" | tail -120 | cut -c1-260 || echo "(no simulator log)"
          echo "::endgroup::"

      # `failure()` alone skipped this on the run that mattered most: a job cut by
      # its timeout counts as cancelled, not failed, and that is precisely the run
      # whose bundle says where it hung.
      - name: Keep the result bundle and the raw log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            test-output.log
          retention-days: 7
