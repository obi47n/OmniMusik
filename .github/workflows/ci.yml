name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# One run per branch. A new push supersedes an in-flight run rather than queueing
# behind it, which matters most for the macOS job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        working-directory: backend
        run: ./mvnw -B verify

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

  infra:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # No credentials and no backend: this checks the configuration is well formed,
      # not what it would do to a live account.
      - name: Validate
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform fmt -check -recursive
          terraform validate

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      # The shared scheme disables parallel testing on purpose; see CLAUDE.md.
      #
      # No OS pin on the destination. The runner image ships whichever iOS runtime
      # is current, and pinning 18.0 failed the moment it stopped being that: "iOS
      # 18.0 is not installed", sixty seconds in, before building anything. The
      # deployment target is what the project pins; the simulator just has to be
      # at or above it. No xcpretty either -- it is a gem the image may not carry,
      # and a formatter that is missing turns a green run red for nothing.
      - name: Test
        run: |
          xcodebuild test \
            -project OmniMusik/OmniMusik.xcodeproj \
            -scheme OmniMusik \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -quiet
