name: Deploy

# Manual by default. A portfolio deployment costs money per run and there is no
# reason for every commit to redeploy it; promoting to push-on-main is a one-line
# change when that becomes the right tradeoff.
on:
  workflow_dispatch:
    inputs:
      component:
        description: What to deploy
        required: true
        default: both
        type: choice
        options: [both, api, web]

permissions:
  id-token: write # Required for OIDC federation
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  api:
    name: API
    if: ${{ inputs.component == 'both' || inputs.component == 'api' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No stored access key: the role is assumed through GitHub's OIDC token and
      # can only be assumed by this repository. See infra/cicd.tf.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        working-directory: backend
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/omnimusik-api"
          # App Runner runs x86_64, and GitHub's ubuntu runners are x86_64 too, so no
          # cross-build is needed. Building on an arm64 machine would need buildx.
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # The service has auto_deployments_enabled, so pushing :latest is usually
      # enough. This makes the rollout explicit rather than implicit.
      - name: Roll out
        run: |
          ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='omnimusik-api'].ServiceArn" \
            --output text)
          [ -n "$ARN" ] && aws apprunner start-deployment --service-arn "$ARN"

  web:
    name: Web
    if: ${{ inputs.component == 'both' || inputs.component == 'web' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # These are build-time constants in the bundle, not secrets: the Cognito app
      # client is public and secured by PKCE. They live in repository variables
      # rather than secrets so they stay readable.
      - name: Build
        working-directory: web
        env:
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Publish
        run: |
          # Hashed assets are immutable and cached hard; index.html must not be, or
          # a deploy ships new assets that nobody's browser ever asks for.
          aws s3 sync web/dist "s3://${{ vars.WEB_BUCKET }}" \
            --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp web/dist/index.html "s3://${{ vars.WEB_BUCKET }}/index.html" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html"
