name: Deploy

# Manual by default. A portfolio deployment costs money per run and there is no
# reason for every commit to redeploy it; promoting to push-on-main is a one-line
# change when that becomes the right tradeoff.
on:
  workflow_dispatch:
    inputs:
      component:
        description: What to deploy
        required: true
        default: both
        type: choice
        options: [both, api, web]

permissions:
  id-token: write # Required for OIDC federation
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  api:
    name: API
    if: ${{ inputs.component == 'both' || inputs.component == 'api' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No stored access key: the role is assumed through GitHub's OIDC token and
      # can only be assumed by this repository. See infra/cicd.tf.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Jib builds and pushes the image with no Docker daemon, and layers it so a
      # source-only change re-pushes kilobytes. Tagged with the commit so every
      # deployment names exactly what it runs; :latest is for a person's convenience.
      - name: Build and push
        working-directory: backend
        run: |
          IMAGE="${{ steps.account.outputs.id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/omnimusik-api"
          ./mvnw -B -q -DskipTests compile jib:build \
            -Dimage.repository="$IMAGE" \
            -Djib.to.tags=latest,${{ github.sha }} \
            -Djib.to.auth.username=AWS \
            -Djib.to.auth.password="$(aws ecr get-login-password --region ${{ env.AWS_REGION }})"

      # ECS Express Mode has no Terraform resource, so the rollout is one script that
      # looks every input up by name. Passing the SHA is what makes it a rollout at
      # all -- ECS resolves the image when a deployment starts, not when a tag moves.
      - name: Roll out
        run: IMAGE_TAG=${{ github.sha }} ./scripts/deploy-api.sh

  web:
    name: Web
    if: ${{ inputs.component == 'both' || inputs.component == 'web' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # These are build-time constants in the bundle, not secrets: the Cognito app
      # client is public and secured by PKCE. They live in repository variables
      # rather than secrets so they stay readable.
      - name: Build
        working-directory: web
        env:
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Publish
        run: |
          # Hashed assets are immutable and cached hard; index.html must not be, or
          # a deploy ships new assets that nobody's browser ever asks for.
          aws s3 sync web/dist "s3://${{ vars.WEB_BUCKET }}" \
            --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp web/dist/index.html "s3://${{ vars.WEB_BUCKET }}/index.html" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html"
