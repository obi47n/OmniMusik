# Production profile. Every value comes from the environment; nothing secret is
# committed. App Runner injects these from its service configuration, with the
# database password sourced from Secrets Manager.

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Schema changes are reviewed, not inferred. ddl-auto=update is convenient in
# development and a liability in production, where it can silently alter a live
# table. A real deployment adds Flyway; this is the honest placeholder until then.
spring.jpa.hibernate.ddl-auto=validate

spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}
omnimusik.cors.allowed-origins=${ALLOWED_ORIGINS}
