spring.application.name=omnimusik-api

# Local development runs against in-memory H2 so the service starts with no
# infrastructure at all. Production overrides these from the environment; see
# application-prod.properties.
spring.datasource.url=jdbc:h2:mem:omnimusik;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# The issuer is the one piece of Cognito configuration the service needs: Spring
# discovers the JWKS endpoint from it and caches the signing keys.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/REPLACE_ME}

omnimusik.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health,info
