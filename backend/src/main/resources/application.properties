spring.application.name=omnimusik-api

# Local development runs against H2 so the service starts with no infrastructure at
# all. Production overrides these from the environment; see
# application-prod.properties.
#
# On disk rather than in memory. In-memory made every restart destructive -- and a
# restart is what happens every time the service is rebuilt, which is constantly --
# so a rebuild silently emptied the database that two clients were syncing against.
# A file needs no more infrastructure than memory did. Tests override this back to
# in-memory, where throwing the data away is the point.
spring.datasource.url=jdbc:h2:file:./data/omnimusik;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# The issuer is the one piece of Cognito configuration the service needs: Spring
# discovers the JWKS endpoint from it and caches the signing keys.
# Defaults to the deployed pool so `./mvnw spring-boot:run` validates real tokens
# with no setup. Not a secret -- an issuer URI is public by construction, since every
# client has to fetch signing keys from it. Overridden by COGNITO_ISSUER_URI in prod.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_c9yH4UiHc}

omnimusik.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health,info
