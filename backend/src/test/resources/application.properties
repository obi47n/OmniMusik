# Tests bypass token validation with MockMvc's jwt() post-processor, but the
# resource server still builds a JwtDecoder at startup. Pointing it at a jwk-set-uri
# rather than an issuer-uri keeps that lazy -- issuer discovery would try to reach
# Cognito while the context loads, so the whole suite would depend on the network.
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:1/jwks.json

spring.datasource.url=jdbc:h2:mem:omnimusik-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
